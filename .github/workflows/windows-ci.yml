name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build application
        run: dotnet build .\src\NotionHelper\NotionHelper.csproj -c Release

      - name: Run deterministic tests
        run: dotnet test .\tests\NotionHelper.Tests\NotionHelper.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Build local model benchmark
        run: dotnet build .\tools\ModelBenchmark\ModelBenchmark.csproj -c Release
